name: Ventoy CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential gcc g++ bzip2 wget curl vim rsync autogen autoconf automake libtool \
          gettext bison binutils flex libpciaccess-dev libusb-1.0-0-dev libfreetype6-dev \
          gnu-efi pesign shim isc-dhcp-client \
          zip nasm acpica-tools zlib1g-dev liblz4-dev squashfs-tools xorriso \
          libssl-dev libdevmapper-dev libfuse-dev libglib2.0-dev libpixman-1-dev \
          libsdl2-dev libvte-2.91-dev libbrlapi-dev libnm-dev

    - name: Download cross-compilation toolchains (optional)
      run: |
        sudo mkdir -p /opt
        cd /opt
        for url in \
          "https://github.com/ventoy/vtoytoolchain/releases/download/1.0/gcc-linaro-7.4.1-2019.02-x86_64_aarch64-linux-gnu.tar.xz" \
          "https://github.com/ventoy/vtoytoolchain/releases/download/1.0/aarch64--uclibc--stable-2020.08-1.tar.bz2" \
          "https://github.com/ventoy/vtoytoolchain/releases/download/1.0/mips-loongson-gcc7.3-2019.06-29-linux-gnu.tar.gz"; do
          fname=$(basename "$url")
          if sudo wget -q "$url" -O "$fname" 2>/dev/null; then
            case "$fname" in
              *.tar.xz) sudo tar -xf "$fname" -C /opt/ 2>/dev/null || true ;;
              *.tar.bz2) sudo tar -xf "$fname" -C /opt/ 2>/dev/null || true ;;
              *.tar.gz) sudo tar -xf "$fname" -C /opt/ 2>/dev/null || true ;;
            esac
            echo "OK: $fname downloaded"
          else
            echo "WARNING: $fname not available, skipping"
          fi
        done

    - name: Download additional build sources
      run: |
        sudo mkdir -p /ventoy/DOC /ventoy/GRUB2 /ventoy/EDK2
        cd /ventoy/DOC
        sudo wget -q https://github.com/ventoy/vtoytoolchain/releases/download/1.0/dietlibc-0.34.tar.xz 2>/dev/null || echo "WARNING: dietlibc not available"
        sudo wget -q https://github.com/ventoy/vtoytoolchain/releases/download/1.0/musl-1.2.1.tar.gz 2>/dev/null || echo "WARNING: musl not available"
        cd /ventoy/GRUB2
        sudo wget -q https://github.com/ventoy/vtoytoolchain/releases/download/1.0/grub-2.04.tar.xz 2>/dev/null || echo "WARNING: grub source not available"
        cd /ventoy/EDK2
        sudo wget -q -O edk2-edk2-stable201911.zip https://codeload.github.com/tianocore/edk2/zip/edk2-stable201911 2>/dev/null || echo "WARNING: edk2 not available"

    - name: Copy repo to /ventoy and build
      run: |
        sudo cp -r . /ventoy/
        cd /ventoy/INSTALL
        sudo sh all_in_one.sh CI

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ventoy-build-artifacts
        path: |
          INSTALL/ventoy-*
          INSTALL/sha256.txt
          DOC/build.log
        if-no-files-found: warn
